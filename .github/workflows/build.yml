name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: |
          sw_vers
          swift --version
          xcodebuild -version | head -2

      - name: 构建 universal app
        run: |
          chmod +x scripts/make-app.sh
          ./scripts/make-app.sh
          lipo -info dist/VoiceSummon.app/Contents/MacOS/VoiceSummon
          codesign --verify --deep --strict dist/VoiceSummon.app && echo "签名校验通过"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: VoiceSummon-macOS
          path: dist/VoiceSummon-*-macOS.zip
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VoiceSummon-*-macOS.zip
          body_path: .github/release-notes.md
          draft: false
          prerelease: false
